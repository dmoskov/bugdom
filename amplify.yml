version: 1
frontend:
  phases:
    preBuild:
      commands:
        - 'echo "Public hosting retired 2026-09-06; deployment is intentionally blocked." >&2; exit 1'
        - npm ci
    build:
      commands:
        - npm run build
  artifacts:
    baseDirectory: dist
    files:
      - '**/*'
  cache:
    paths:
      - node_modules/**/*
